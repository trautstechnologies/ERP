
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>TRAUTS Shop Manager</title>
  <link rel="stylesheet" href="../user.css/style.css">
  <script src="../script.js/script.js" defer></script>
  <script src="../script.js/dashboard-mobile.js" defer></script>
</head>
<body>

<main class="auth-container">
  <div class="auth-card">

    <div class="login-theme-row">
      <button type="button"
              id="trautsThemeToggle"
              class="login-theme-toggle"
              aria-label="Switch to dark mode"
              aria-pressed="false">

    <span id="trautsThemeSymbol"
          aria-hidden="true">☾</span>

      </button>
    </div>


    <div class="brand">
      <div class="brand-icon">

        <img src="../img/trauts-logo.jpg" alt="TRAUTS Logo" width="70" height="70">
      </div>
      <h1>TRAUTS</h1>
      <p>SHOP MANAGER</p>
    </div>

    <div class="tabs">
      <button id="loginTab"
              class="active" type="button">
        Login
      </button>
      <button id="signupTab" type="button">
        Sign Up
      </button>
    </div>

    <form id="authForm">

      <div id="nameGroup" class="form-group hidden">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName"
               autocomplete="name"
               enterkeyhint="next"
               placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required
               autocomplete="email"
               enterkeyhint="next"
               placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-input-wrap">
          <input type="password" id="password"
                 required minlength="8"
                 autocomplete="current-password"
                 enterkeyhint="done"
                 placeholder="Enter your password">

          <button type="button"
                  class="password-toggle"
                  data-target="password"
                  aria-label="Show password"
                  aria-pressed="false">
            <svg viewBox="0 0 24 24"
                 width="22" height="22"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path class="eye-slash" d="M3 3l18 18"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="confirmGroup"
           class="form-group hidden">
        <label for="confirmPassword">
          Confirm Password
        </label>

        <div class="password-input-wrap">
          <input type="password"
                 id="confirmPassword"
                 autocomplete="new-password"
                 enterkeyhint="done"
                 placeholder="Confirm your password">

          <button type="button"
                  class="password-toggle"
                  data-target="confirmPassword"
                  aria-label="Show password"
                  aria-pressed="false">
            <svg viewBox="0 0 24 24"
                 width="22" height="22"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path class="eye-slash" d="M3 3l18 18"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn"
              class="primary-btn">
        Login
      </button>

      <p id="message" role="status"></p>

    </form>

      <!-- FORGOT PASSWORD LINK -->
      <div class="forgot-password-row">
          <button
                  type="button"
                  id="forgotPasswordBtn"
                  class="forgot-password-link">
              Forgot password?
          </button>
      </div>


      <p class="footer">
      © Powered by Trauts technologies
    </p>
  </div>
</main>


<!-- PASSWORD RESET MODAL -->
<div id="passwordResetOverlay"
     class="password-reset-overlay"
     hidden>

    <div class="password-reset-card"
         role="dialog"
         aria-modal="true"
         aria-labelledby="passwordResetTitle">

        <button type="button"
                id="closePasswordReset"
                class="password-reset-close"
                aria-label="Close">
            &times;
        </button>

        <h2 id="passwordResetTitle">
            Reset your password
        </h2>

        <p class="password-reset-description">
            Enter the email address linked to your
            TRAUTS account.
        </p>

        <form id="passwordResetForm">

            <label for="resetEmail">
                Email address
            </label>

            <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            <button type="submit"
                    class="password-reset-submit">
                Continue
            </button>

            <p id="passwordResetMessage"
               class="password-reset-message"
               role="status"
               aria-live="polite"></p>

        </form>

    </div>
</div>

</body>
</html>
